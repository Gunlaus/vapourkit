name: Tauri migration build

on:
  pull_request:
    paths:
      - 'src-tauri/**'
      - 'src/TauriMigrationStatus.tsx'
      - 'src/main.tsx'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/tauri-migration.yml'
  workflow_dispatch:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Linux Tauri prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - name: Install frontend dependencies and reconcile migration lockfile
        run: npm install --no-audit --no-fund
      - name: Check renderer
        run: npm run build:renderer
      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Build experimental Tauri host
        run: npm run build:tauri
