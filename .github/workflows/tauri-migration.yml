name: Tauri migration build

on:
  pull_request:
    paths:
      - 'src-tauri/**'
      - 'src/TauriMigrationStatus.tsx'
      - 'src/main.tsx'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/tauri-migration.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Linux Tauri prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - name: Install frontend dependencies and reconcile migration lockfile
        run: npm install --no-audit --no-fund
      - name: Commit reconciled npm lockfile (same-repository PR only)
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && matrix.os == 'ubuntu-22.04'
        shell: bash
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "build: synchronize npm lockfile for Tauri"
            git fetch origin feat/tauri-rust-overhaul
            git rebase origin/feat/tauri-rust-overhaul
            git push origin HEAD:refs/heads/feat/tauri-rust-overhaul
          fi
      - name: Check renderer
        run: npm run build:renderer
      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Build experimental Tauri host
        run: npm run build:tauri
      - name: Upload Windows diagnostic executable
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: vapourkit-tauri-diagnostics-windows
          path: src-tauri/target/release/vapourkit.exe
          if-no-files-found: error
          retention-days: 14
