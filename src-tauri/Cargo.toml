[package]
name = "vapourkit"
version = "2.1.0"
description = "Vapourkit desktop host"
authors = ["Vapourkit contributors"]
edition = "2021"

[lib]
name = "vapourkit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
